name: Release

# Publishes one version everywhere at once: the desktop installers on a GitHub
# release (which the app's updater reads) and the sync server image on ghcr.io.
#
# Start it any of these ways:
#   - merge a pull request labelled "release: patch", "release: minor" or
#     "release: major" (see release-on-merge.yml, which picks the version)
#   - Actions -> Release -> Run workflow, and type a version such as 0.2.0
#   - or push a tag:  git tag v0.2.0 && git push origin v0.2.0
#
# The version comes from that input or tag, never from package.json, so the
# app, the release and the image tags cannot disagree.
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+*']
  workflow_dispatch:
    inputs:
      version:
        description: Version to release, without the "v" (for example 0.2.0)
        required: true
        type: string
      ref:
        description: Commit to release (full SHA). Leave empty for the newest commit on the chosen branch.
        required: false
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
      sha: ${{ steps.v.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_REF: ${{ inputs.ref }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            version="$INPUT_VERSION"
          else
            version="$GITHUB_REF_NAME"
          fi
          # Tidies and checks it; see the script and its tests.
          version="$(.github/scripts/release-version.sh "$version")"
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ] && \
             git ls-remote --exit-code --tags origin "refs/tags/v$version" >/dev/null; then
            echo "::error::v$version has already been released. Choose a higher version."
            exit 1
          fi
          # Every job builds this one commit, even if the branch moves meanwhile.
          sha="${INPUT_REF:-$GITHUB_SHA}"
          if ! printf '%s' "$sha" | grep -Eq '^[0-9a-f]{40}$'; then
            echo "::error::\"$sha\" is not a full commit SHA"
            exit 1
          fi
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) prerelease=true ;; *) prerelease=false ;; esac
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"
          echo "Releasing $version (prerelease: $prerelease)" >> "$GITHUB_STEP_SUMMARY"

  test:
    # Everything below waits for this: every test, desktop and mobile.
    name: Test
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      # node-pty and ssh2's cpu-features compile during npm ci, at the same
      # time. Left alone, each downloads Node's headers into one shared cache
      # and one can read a half-written file (an empty common.gypi). Use the
      # headers that come with this Node instead, so nothing is downloaded.
      - name: Use the installed Node's headers for native modules
        if: runner.os == 'Linux'
        shell: bash
        run: echo "npm_config_nodedir=$(dirname "$(dirname "$(command -v node)")")" >> "$GITHUB_ENV"
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - run: xvfb-run -a npm run e2e
      # The same checks the Android job in build.yml runs, so nothing is
      # released that a pull request would have failed.
      - name: Mobile web end-to-end test
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          export CHROME_PATH
          test -n "$CHROME_PATH"
          npm run e2e -w @termterm/mobile
      # A real OpenSSH server for the SSH core's certificate, agent and proxy
      # checks (they are skipped without one).
      - name: Install OpenSSH
        run: |
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends openssh-server
          fi
      - name: SSH core test
        run: npm run test:ssh -w @termterm/mobile

  desktop:
    name: Desktop (${{ matrix.name }})
    needs: [version, test]
    strategy:
      fail-fast: true
      matrix:
        include:
          - name: Windows
            os: windows-latest
            files: |
              apps/desktop/release/*.exe
              apps/desktop/release/*.exe.blockmap
              apps/desktop/release/latest.yml
          - name: Linux
            os: ubuntu-latest
            files: |
              apps/desktop/release/*.AppImage
              apps/desktop/release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # node-pty and ssh2's cpu-features compile during npm ci, at the same
      # time. Left alone, each downloads Node's headers into one shared cache
      # and one can read a half-written file (an empty common.gypi). Use the
      # headers that come with this Node instead, so nothing is downloaded.
      - name: Use the installed Node's headers for native modules
        if: runner.os == 'Linux'
        shell: bash
        run: echo "npm_config_nodedir=$(dirname "$(dirname "$(command -v node)")")" >> "$GITHUB_ENV"
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Stamp version ${{ needs.version.outputs.version }}
        run: >
          npm version "${{ needs.version.outputs.version }}"
          --workspaces --include-workspace-root
          --no-git-tag-version --allow-same-version
      - run: npm run dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ matrix.name }}
          path: ${{ matrix.files }}
          if-no-files-found: error
          # Only needed until the publish job attaches them to the release.
          retention-days: 1

  android:
    name: Android app
    needs: [version, test]
    runs-on: ubuntu-latest
    steps:
      # The APK must be signed with the same key every time, or a new version
      # will not install over the old one. The key lives in repository secrets
      # (see "Android signing key" in the README). Without them the release
      # still goes out, just without an APK.
      - id: signing
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE" ]; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
            echo "::warning::No Android signing key is configured, so this release has no APK. See the README."
            echo "No Android APK: the signing key secrets are not set." >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.signing.outputs.available == 'true'
        with:
          ref: ${{ needs.version.outputs.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: steps.signing.outputs.available == 'true'
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        if: steps.signing.outputs.available == 'true'
        with:
          distribution: temurin
          java-version: 21
      # node-pty and ssh2's cpu-features compile during npm ci, at the same
      # time. Left alone, each downloads Node's headers into one shared cache
      # and one can read a half-written file (an empty common.gypi). Use the
      # headers that come with this Node instead, so nothing is downloaded.
      - name: Use the installed Node's headers for native modules
        if: runner.os == 'Linux'
        shell: bash
        run: echo "npm_config_nodedir=$(dirname "$(dirname "$(command -v node)")")" >> "$GITHUB_ENV"
      - run: npm ci
        if: steps.signing.outputs.available == 'true'
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Stamp version ${{ needs.version.outputs.version }}
        if: steps.signing.outputs.available == 'true'
        run: >
          npm version "${{ needs.version.outputs.version }}"
          --workspaces --include-workspace-root
          --no-git-tag-version --allow-same-version
      - name: Build signed APK
        if: steps.signing.outputs.available == 'true'
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          export ANDROID_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          printf '%s' "$KEYSTORE" | base64 --decode > "$ANDROID_KEYSTORE_FILE"
          npm run sync -w @termterm/mobile
          (cd apps/mobile/android && ./gradlew assembleRelease)
          rm -f "$ANDROID_KEYSTORE_FILE"
          mkdir -p apk
          cp "apps/mobile/android/app/build/outputs/apk/release/termterm-$VERSION-release.apk" "apk/termterm-$VERSION.apk"
          ls -la apk
      # Signed by the release key (or it will not install over the app), with
      # the version and version code this release should have.
      - name: Check the APK
        if: steps.signing.outputs.available == 'true'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: .github/scripts/check-apk.sh "apk/termterm-$VERSION.apk" "$VERSION" "$(cat .github/android-release-cert.sha256)"
      # No release with a known vulnerability in the libraries it ships.
      - name: Scan the Android libraries
        if: steps.signing.outputs.available == 'true'
        run: .github/scripts/scan-dependencies.sh android apps/mobile/android
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.signing.outputs.available == 'true'
        with:
          name: release-Android
          path: apk/*.apk
          if-no-files-found: error
          retention-days: 1

  image:
    name: Sync server image
    # Only once the apps have built, so a failed release cannot move the
    # image's "latest" tag ahead of the apps.
    needs: [version, test, desktop, android]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
      # Scanned before anything is pushed: no release with a known
      # vulnerability in the image or its OS packages.
      - name: Scan the image
        run: |
          docker build -f apps/server/Dockerfile -t termterm-server-scan .
          .github/scripts/scan-dependencies.sh image termterm-server-scan
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: tags
        env:
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/termterm-server"
          tags="$image:$VERSION"
          # Moving tags only follow stable releases.
          if [ "$PRERELEASE" = "false" ]; then
            tags="$tags,$image:${VERSION%.*},$image:latest"
          fi
          echo "tags=$tags" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=${{ needs.version.outputs.version }}
          tags: ${{ steps.tags.outputs.tags }}

  publish:
    name: Publish release
    needs: [version, desktop, android, image]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.version.outputs.sha }}
          sparse-checkout: .github/scripts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - run: ls -la dist
      # Every file there, and the updater's metadata agreeing with them, before
      # anything is published. The APK is required when a signing key is set.
      - name: Check the release files
        env:
          VERSION: ${{ needs.version.outputs.version }}
          HAS_APK_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          if [ "$HAS_APK_KEY" = true ]; then apk=--apk; else apk=; fi
          node .github/scripts/check-release-files.mjs dist "$VERSION" $apk
      - id: notes
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          if ls dist/*.apk >/dev/null 2>&1; then
            echo "android=- Android: install \`termterm-$VERSION.apk\`. Android asks you to allow installing from your browser or file manager the first time. It installs over an earlier version and keeps your vault." >> "$GITHUB_OUTPUT"
          else
            echo "android=- Android: no APK in this release (no signing key was configured)." >> "$GITHUB_OUTPUT"
          fi
      # Created in one step, with every file attached, so the updater never
      # sees a release that is only half uploaded.
      - uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          tag_name: v${{ needs.version.outputs.version }}
          target_commitish: ${{ needs.version.outputs.sha }}
          name: termterm ${{ needs.version.outputs.version }}
          prerelease: ${{ needs.version.outputs.prerelease == 'true' }}
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: dist/*
          body: |
            **Desktop app**
            - Windows: run `termterm-${{ needs.version.outputs.version }}-setup.exe`. The installer is not code-signed, so choose *More info → Run anyway* if SmartScreen appears. Installed copies update themselves from Settings → About.
            - Linux: `termterm-${{ needs.version.outputs.version }}-x86_64.AppImage`.
            ${{ steps.notes.outputs.android }}

            **Sync server**
            ```
            docker pull ghcr.io/${{ github.repository_owner }}/termterm-server:${{ needs.version.outputs.version }}
            ```
