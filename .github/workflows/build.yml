name: Build

# Checks every pull request and every push to main. Each app is built only
# when its own code, or shared code it depends on, has changed. Pushes to main
# that touch the server also publish its image as `edge`. Versioned releases,
# which always build everything, are made by release.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer run for the same branch or pull request replaces an older one.
# (The group was renamed from "build-..." after a GitHub incident left a run
# stuck in that group that could not be cancelled and blocked later runs.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which apps this change can affect, so the slow jobs below run only
  # when they need to. A change to shared code (packages/, lockfile, this
  # workflow) counts for every app. Manual runs build everything.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.areas.outputs.desktop }}
      mobile: ${{ steps.areas.outputs.mobile }}
      server: ${{ steps.areas.outputs.server }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: areas
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then BASE=""; fi
          .github/scripts/changed-areas.sh "$BASE" | tee -a "$GITHUB_OUTPUT"

  # Fast checks across the whole repository: always run.
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # node-pty and ssh2's cpu-features compile during npm ci, at the same
      # time. Left alone, each downloads Node's headers into one shared cache
      # and one can read a half-written file (an empty common.gypi). Use the
      # headers that come with this Node instead, so nothing is downloaded.
      - name: Use the installed Node's headers for native modules
        if: runner.os == 'Linux'
        shell: bash
        run: echo "npm_config_nodedir=$(dirname "$(dirname "$(command -v node)")")" >> "$GITHUB_ENV"
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test

  # The workflows and scripts themselves, including those only a release runs.
  workflow-checks:
    name: Workflow and script checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: actionlint
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
        run: |
          file="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/$file" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/$file"
          echo "$ACTIONLINT_SHA256  $RUNNER_TEMP/$file" | sha256sum --check --quiet
          tar -xzf "$RUNNER_TEMP/$file" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color
      - name: shellcheck
        run: shellcheck .github/scripts/*.sh apps/mobile/ssh-test/run.sh apps/server/test/compat/make-fixtures.sh
      - name: Release version rules
        run: .github/scripts/test-release-version.sh
      - name: APK check (with stand-in Android tools)
        run: .github/scripts/test-check-apk.sh
      - name: Release file checks
        run: node --test .github/scripts/check-release-files.test.mjs

  desktop-e2e:
    name: Desktop end-to-end test
    needs: changes
    # The test drives the desktop app against the sync server, so either can break it.
    if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # node-pty and ssh2's cpu-features compile during npm ci, at the same
      # time. Left alone, each downloads Node's headers into one shared cache
      # and one can read a half-written file (an empty common.gypi). Use the
      # headers that come with this Node instead, so nothing is downloaded.
      - name: Use the installed Node's headers for native modules
        if: runner.os == 'Linux'
        shell: bash
        run: echo "npm_config_nodedir=$(dirname "$(dirname "$(command -v node)")")" >> "$GITHUB_ENV"
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # A real OpenSSH server for the checks that ssh2's own test server
      # cannot do: certificates, agent forwarding from the server's side.
      - name: Install OpenSSH
        run: |
          if [ ! -x /usr/sbin/sshd ]; then
            sudo apt-get update -q
            sudo apt-get install -y -q --no-install-recommends openssh-server
          fi
      - name: OpenSSH check (certificates, agent forwarding, proxies)
        run: npm run check:openssh -w @termterm/desktop
      - run: xvfb-run -a npm run e2e
      # Only worth keeping when something went wrong.
      - name: Upload e2e screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-screenshots
          path: apps/desktop/test-results
          if-no-files-found: ignore
          retention-days: 7

  server-image:
    name: Sync server image
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: docker build -f apps/server/Dockerfile -t termterm-server .
      - name: Start the container and check it responds
        run: |
          # A bind mount Docker creates is owned by root: the case that used to
          # leave the server unable to open its database.
          docker run -d --name termterm -p 8787:8787 -e PUID=99 -e PGID=100 \
            -v "$RUNNER_TEMP/termterm-data:/data" termterm-server
          for _ in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8787/v1/health; then
              echo
              docker exec termterm sh -c 'echo "server runs as uid $(stat -c %u /proc/1)"; test "$(stat -c %u /proc/1)" = 99'
              test "$(stat -c %u "$RUNNER_TEMP/termterm-data/termterm.db")" = 99
              exit 0
            fi
            sleep 1
          done
          docker logs termterm
          exit 1
      - name: Back up a running server and restore it into a new container
        run: .github/scripts/check-backup-restore.sh termterm-server
      # Everything below runs only for pushes to main.
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the edge image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=edge-${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/termterm-server:edge

  windows:
    name: Windows installer
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # node-pty and ssh2's cpu-features compile during npm ci, at the same
      # time. Left alone, each downloads Node's headers into one shared cache
      # and one can read a half-written file (an empty common.gypi). Use the
      # headers that come with this Node instead, so nothing is downloaded.
      - name: Use the installed Node's headers for native modules
        if: runner.os == 'Linux'
        shell: bash
        run: echo "npm_config_nodedir=$(dirname "$(dirname "$(command -v node)")")" >> "$GITHUB_ENV"
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Exercises the Windows Hello script against the real Windows APIs for
      # the steps that need no person present (the prompt itself cannot run here).
      - name: Windows Hello check
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON apps/desktop/scripts/check-windows-hello.mjs
      # Starts the shells a local terminal would offer on Windows, through the
      # same prebuilt module the app ships, and checks each runs a command.
      - name: Local terminal check
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON apps/desktop/scripts/check-local-shells.mjs
      - name: Build installer
        run: npm run dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termterm-windows
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android app
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: 21
      # node-pty and ssh2's cpu-features compile during npm ci, at the same
      # time. Left alone, each downloads Node's headers into one shared cache
      # and one can read a half-written file (an empty common.gypi). Use the
      # headers that come with this Node instead, so nothing is downloaded.
      - name: Use the installed Node's headers for native modules
        if: runner.os == 'Linux'
        shell: bash
        run: echo "npm_config_nodedir=$(dirname "$(dirname "$(command -v node)")")" >> "$GITHUB_ENV"
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # GitHub's runners ship Chrome, so nothing needs downloading. (Playwright's
      # own installer pulls system packages and fails when the runner's network
      # is flaky.)
      - name: Mobile web end-to-end test
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          export CHROME_PATH
          echo "Using browser: $CHROME_PATH"
          test -n "$CHROME_PATH"
          npm run e2e -w @termterm/mobile
      - name: SSH core test
        run: npm run test:ssh -w @termterm/mobile
      - name: Build debug APK
        run: npm run apk -w @termterm/mobile
      # The release workflow's APK check, on this debug build (its own throwaway
      # key, so no certificate check), so a broken check shows up here first.
      - name: Check the APK
        run: |
          apk="$(ls apps/mobile/android/app/build/outputs/apk/debug/*.apk)"
          name="$(node -p "require('./apps/mobile/package.json').version")-debug"
          .github/scripts/check-apk.sh "$apk" "$name"
      # A debug build, signed with a throwaway key: for trying out, not for
      # keeping. It cannot be installed over a build from another run.
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: termterm-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload e2e screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-e2e-screenshots
          path: apps/mobile/test-results

  # The debug APK installed on an Android emulator and driven through its
  # WebView: the native SSH code, a port forward and the file browser, against
  # a throwaway SSH server on the runner.
  android-emulator:
    name: Android app on an emulator
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - name: Use the installed Node's headers for native modules
        shell: bash
        run: echo "npm_config_nodedir=$(dirname "$(dirname "$(command -v node)")")" >> "$GITHUB_ENV"
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: termterm-android-debug
          path: apk
      # The emulator needs hardware acceleration, which GitHub's Linux runners
      # offer through KVM once it is opened up to the runner's user.
      - name: Allow KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test on an emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot
          script: node apps/mobile/emulator-test/run.mjs "$(ls apk/*.apk)"
      - name: Upload what the emulator showed
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: emulator-results
          path: apps/mobile/test-results
          if-no-files-found: ignore
          retention-days: 7
