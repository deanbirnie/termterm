name: Build

# Checks every pull request and every push to main. Each app is built only
# when its own code, or shared code it depends on, has changed. Pushes to main
# that touch the server also publish its image as `edge`. Versioned releases,
# which always build everything, are made by release.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A newer run for the same branch or pull request replaces an older one.
# (The group was renamed from "build-..." after a GitHub incident left a run
# stuck in that group that could not be cancelled and blocked later runs.)
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Decides which apps this change can affect, so the slow jobs below run only
  # when they need to. A change to shared code (packages/, lockfile, this
  # workflow) counts for every app. Manual runs build everything.
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    outputs:
      desktop: ${{ steps.areas.outputs.desktop }}
      mobile: ${{ steps.areas.outputs.mobile }}
      server: ${{ steps.areas.outputs.server }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: areas
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then BASE=""; fi
          .github/scripts/changed-areas.sh "$BASE" | tee -a "$GITHUB_OUTPUT"

  # Fast checks across the whole repository: always run.
  test:
    name: Typecheck and unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test

  desktop-e2e:
    name: Desktop end-to-end test
    needs: changes
    # The test drives the desktop app against the sync server, so either can break it.
    if: needs.changes.outputs.desktop == 'true' || needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: xvfb-run -a npm run e2e
      # Only worth keeping when something went wrong.
      - name: Upload e2e screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: apps/desktop/test-results
          if-no-files-found: ignore
          retention-days: 7

  server-image:
    name: Sync server image
    needs: changes
    if: needs.changes.outputs.server == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/server/Dockerfile -t termterm-server .
      - name: Start the container and check it responds
        run: |
          # A bind mount Docker creates is owned by root: the case that used to
          # leave the server unable to open its database.
          docker run -d --name termterm -p 8787:8787 -e PUID=99 -e PGID=100 \
            -v "$RUNNER_TEMP/termterm-data:/data" termterm-server
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8787/v1/health; then
              echo
              docker exec termterm sh -c 'echo "server runs as uid $(stat -c %u /proc/1)"; test "$(stat -c %u /proc/1)" = 99'
              test "$(stat -c %u "$RUNNER_TEMP/termterm-data/termterm.db")" = 99
              exit 0
            fi
            sleep 1
          done
          docker logs termterm
          exit 1
      # Everything below runs only for pushes to main.
      - uses: docker/setup-qemu-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the edge image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=edge-${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/termterm-server:edge

  windows:
    name: Windows installer
    needs: changes
    if: needs.changes.outputs.desktop == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # Exercises the Windows Hello script against the real Windows APIs for
      # the steps that need no person present (the prompt itself cannot run here).
      - name: Windows Hello check
        run: node --disable-warning=MODULE_TYPELESS_PACKAGE_JSON apps/desktop/scripts/check-windows-hello.mjs
      - name: Build installer
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: termterm-windows
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 7

  android:
    name: Android app
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      # GitHub's runners ship Chrome, so nothing needs downloading. (Playwright's
      # own installer pulls system packages and fails when the runner's network
      # is flaky.)
      - name: Mobile web end-to-end test
        run: |
          export CHROME_PATH="$(command -v google-chrome || command -v chromium-browser || command -v chromium)"
          echo "Using browser: $CHROME_PATH"
          test -n "$CHROME_PATH"
          npm run e2e -w @termterm/mobile
      - name: SSH core test
        run: npm run test:ssh -w @termterm/mobile
      - name: Build debug APK
        run: npm run apk -w @termterm/mobile
      # A debug build, signed with a throwaway key: for trying out, not for
      # keeping. It cannot be installed over a build from another run.
      - uses: actions/upload-artifact@v4
        with:
          name: termterm-android-debug
          path: apps/mobile/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 7
      - name: Upload e2e screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mobile-e2e-screenshots
          path: apps/mobile/test-results
          if-no-files-found: ignore
          retention-days: 7
