name: Build

# Checks every pull request and every push to main. Pushes to main also
# publish the sync server image as `edge`. Versioned releases are made by
# release.yml.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - name: End-to-end test
        run: xvfb-run -a npm run e2e
      # Only worth keeping when something went wrong.
      - name: Upload e2e screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: apps/desktop/test-results
          if-no-files-found: ignore
          retention-days: 7

  server-image:
    name: Sync server image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/server/Dockerfile -t termterm-server .
      - name: Start the container and check it responds
        run: |
          docker run -d --name termterm -p 8787:8787 termterm-server
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8787/v1/health && exit 0
            sleep 1
          done
          docker logs termterm
          exit 1
      # Everything below runs only for pushes to main.
      - uses: docker/setup-qemu-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: docker/setup-buildx-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
      - uses: docker/login-action@v3
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the edge image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/server/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: VERSION=edge-${{ github.sha }}
          tags: ghcr.io/${{ github.repository_owner }}/termterm-server:edge

  windows:
    name: Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Build installer
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: termterm-windows
          path: apps/desktop/release/*.exe
          if-no-files-found: error
          retention-days: 7
