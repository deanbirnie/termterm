name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - run: npm run typecheck
      - run: npm test
      - name: End-to-end test
        run: xvfb-run -a npm run e2e
      - name: Upload e2e screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: apps/desktop/test-results
          if-no-files-found: ignore

  server-image:
    name: Sync server image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -f apps/server/Dockerfile -t termterm-server .
      - name: Start the container and check it responds
        run: |
          docker run -d --name termterm -p 8787:8787 termterm-server
          for i in $(seq 1 20); do
            curl -fsS http://127.0.0.1:8787/v1/health && exit 0
            sleep 1
          done
          docker logs termterm
          exit 1

  windows:
    name: Windows installer
    runs-on: windows-latest
    permissions:
      contents: write # attach installers to the release on version tags
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
      - name: Build installer
        run: npm run dist
      - uses: actions/upload-artifact@v4
        with:
          name: termterm-windows
          path: apps/desktop/release/*.exe
          if-no-files-found: error
      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: apps/desktop/release/*.exe
