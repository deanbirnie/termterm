# termterm sync server, from the image published by this repository's releases.
#
#   docker compose up -d
#
# It listens on 127.0.0.1:8787. Put a TLS-terminating reverse proxy in front
# of it (Traefik, Caddy, nginx; Dokploy does this for you) and use that
# https:// address as the sync server in the app.
#
# To update:  docker compose pull && docker compose up -d
# To pin a version, replace "latest" with e.g. "0.2.0" (or "0.2" for patch updates).
# To build from this checkout instead:  docker compose up -d --build
services:
  termterm-server:
    image: ghcr.io/deanbirnie/termterm-server:latest
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    restart: unless-stopped
    ports:
      - "127.0.0.1:8787:8787"
    environment:
      # The user and group the server runs as, and that own the data files.
      # Set these to match the owner of a bind-mounted data folder
      # (Unraid: 99 and 100).
      PUID: "${PUID:-1000}"
      PGID: "${PGID:-1000}"
      TERMTERM_TRUST_PROXY: "true"
      # Set to "false" once your account exists to close sign-ups.
      TERMTERM_ALLOW_REGISTRATION: "true"
    volumes:
      - termterm-data:/data

volumes:
  termterm-data:
